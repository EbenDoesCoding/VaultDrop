[project]
name = "vaultdrop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "httpx2>=2.16.2",
    "psycopg[binary]>=3.3.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
[tool.pytest.ini_options]
pythonpath = ["."]
