services:
  app:
    build: .
    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaultdrop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vaultdrop"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
